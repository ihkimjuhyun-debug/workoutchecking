<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Elite PR Tracker v11.0 (Masterpiece Edition)</title>
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="app-container">
    <header>
      <h1 onclick="showView('home-view')">🔥 PR Tracker</h1>
      <nav>
        <button onclick="showView('search-view')">검색</button>
        <button onclick="showView('hof-view')">명예의전당</button>
        <button onclick="showView('goal-view')" style="color: var(--primary);">AI 목표</button>
        <button onclick="showView('settings-view')">⚙️ 설정</button>
      </nav>
    </header>

    <!-- 1. 메인 홈 -->
    <div id="home-view" class="view-section active">
      <h2>오늘의 운동 부위 선택</h2>
      <div class="category-grid mt-20" id="category-selection">
        <div class="cat-btn" data-cat="어깨">어깨</div><div class="cat-btn" data-cat="등">등</div>
        <div class="cat-btn" data-cat="가슴">가슴</div><div class="cat-btn" data-cat="하체">하체</div>
        <div class="cat-btn" data-cat="팔">팔</div><div class="cat-btn" data-cat="복근">복근</div>
        <div class="cat-btn" data-cat="케틀벨">케틀벨</div><div class="cat-btn" data-cat="유산소">유산소</div>
      </div>
      <button class="primary-btn mt-20" onclick="startWorkout()">운동 일지 기록 시작하기</button>
    </div>

    <!-- 2. 운동 기록 입력 (낱말 카드 부활) -->
    <div id="record-view" class="view-section">
      <h2 id="current-categories-title" class="mb-10">운동 기록</h2>
      
      <!-- 🔥 낱말 카드 컨테이너 (가로 스크롤) -->
      <div style="font-size: 0.85rem; color: #aaa; margin-bottom: 5px;">빠른 종목 추가 (낱말 카드 터치)</div>
      <div id="quick-select-container" class="quick-card-container mb-20" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px;"></div>
      
      <div id="exercise-inputs-container"></div>
      
      <button class="secondary-btn mb-20" style="border: 1px dashed var(--primary); background: transparent; color: var(--primary);" onclick="addExerciseInput()">➕ 수동으로 다른 종목 추가</button>
      <div class="action-buttons">
        <button class="primary-btn" onclick="saveRecord('now')">지금 시간으로 일지 저장</button>
        <button class="secondary-btn mt-10" onclick="togglePastDateInput()">과거/특정 시간으로 기록</button>
      </div>
      <div id="past-date-container" style="display: none; margin-top: 15px;">
        <input type="datetime-local" id="input-past-date" step="1">
        <button class="primary-btn mt-10" onclick="saveRecord('past')">선택한 시간으로 저장</button>
      </div>
    </div>

    <!-- 3. 명예의 전당 -->
    <div id="hof-view" class="view-section">
      <h2 class="mb-10">🏆 명예의 전당</h2>
      <p style="font-size: 0.85rem; color: #aaa; margin-bottom: 15px;">기록 카드를 터치하면 상세 세션 내용(무게/횟수)을 볼 수 있습니다.</p>
      <div class="hof-tabs mb-20">
        <button class="hof-tab active" onclick="switchHofTab('volume')">🔴 역대 볼륨 순위</button>
        <button class="hof-tab" onclick="switchHofTab('weight')" style="display: none;">🟡 최고 무게 PR</button>
      </div>
      <div id="hof-volume-list" class="list-container"></div>
    </div>

    <!-- 4. 통합 검색 및 종목 관리 -->
    <div id="search-view" class="view-section">
      <h2 class="mb-20">🔍 통합 검색</h2>
      <div class="category-grid mb-20" id="filter-categories">
        <div class="cat-btn" data-filter="어깨">어깨</div><div class="cat-btn" data-filter="등">등</div>
        <div class="cat-btn" data-filter="가슴">가슴</div><div class="cat-btn" data-filter="하체">하체</div>
        <div class="cat-btn" data-filter="팔">팔</div><div class="cat-btn" data-filter="복근">복근</div>
        <div class="cat-btn" data-filter="케틀벨">케틀벨</div><div class="cat-btn" data-filter="유산소">유산소</div>
      </div>
      <input type="text" id="search-input" placeholder="종목 검색..." class="mb-20" onkeyup="searchExercises()">
      <div id="exercise-list" class="list-container"></div>
      
      <button class="secondary-btn mt-20" onclick="toggleCustomExerciseForm()">➕ 맞춤 종목/AI 썸네일 추가</button>
      <div id="custom-exercise-form" class="record-card" style="display: none; margin-top:15px; border-color: var(--primary);">
        <div class="input-group"><label>종목명</label><input type="text" id="custom-ex-name" placeholder="예: 불가리안 백 스핀"></div>
        <div class="input-row">
          <div class="input-group"><label>카테고리</label><select id="custom-ex-cat" class="custom-select"><option value="케틀벨">케틀벨</option><option value="하체">하체</option><option value="가슴">가슴</option><option value="등">등</option><option value="어깨">어깨</option></select></div>
          <div class="input-group"><label>타겟 부위</label><input type="text" id="custom-ex-target"></div>
        </div>
        <div id="ai-img-preview" style="display:none; text-align:center; margin:15px 0;"><img id="generated-img" style="width:60px; height:60px; border-radius:10px; border:2px solid var(--primary); object-fit: cover;"></div>
        <button class="secondary-btn mt-10" id="btn-gen-img" onclick="generateDalleIcon()">🎨 AI 썸네일 생성</button>
        <button class="primary-btn mt-10" onclick="addCustomExercise()">✅ 종목 최종 저장</button>
      </div>
    </div>

    <!-- 5. 히스토리 조회 뷰 -->
    <div id="history-view" class="view-section">
      <button class="secondary-btn mb-20" onclick="showView('search-view')" style="width: auto; padding: 8px 15px;">⬅ 뒤로 가기</button>
      <h2 id="history-title" class="mb-10">기록 비교</h2>
      <div id="history-list" class="list-container mb-20"></div>
    </div>

    <!-- 6. 🔥 세션 상세 뷰 (터치 시 전개) -->
    <div id="session-detail-view" class="view-section">
      <button class="secondary-btn mb-20" onclick="showView('hof-view')" style="width: auto; padding: 8px 15px;">⬅ 뒤로 가기</button>
      <div style="background: #2a2a2a; padding: 15px; border-radius: 10px; border-left: 4px solid var(--primary); margin-bottom: 20px;">
        <h2 id="session-detail-title" style="margin-bottom: 5px; font-size: 1.3rem;">세션 상세</h2>
        <div id="session-detail-info" style="color: var(--primary); font-weight: bold; font-size: 0.95rem;"></div>
      </div>
      <div id="session-workout-list" class="list-container mb-20"></div>
    </div>

    <!-- 7. 다중 AI 목표 지원 뷰 -->
    <div id="goal-view" class="view-section">
      <div id="active-goals-header" style="display:flex; justify-content:space-between; align-items:center;" class="mb-20">
        <h2 style="margin:0;">🔥 진행 중인 목표들</h2>
        <button class="primary-btn" style="width:auto; padding:8px 15px; font-size:0.9rem;" onclick="toggleGoalSetup()">➕ 새 목표 추가</button>
      </div>

      <div id="goal-setup-area" style="display: none; margin-bottom: 30px;">
        <div class="record-card">
          <h3 class="mb-20" style="color:var(--primary);">🎯 새로운 AI 루틴 설계</h3>
          <div class="input-group"><label>목표 종목명</label><input type="text" id="goal-name" placeholder="예: OHP, 데드리프트"></div>
          <div class="input-row mb-10"><input type="number" id="goal-target-weight" placeholder="목표 무게(kg)"><input type="number" id="goal-target-reps" placeholder="목표 횟수(회)"></div>
          <div class="input-row mb-10"><input type="number" id="goal-current-weight" placeholder="현재 무게(kg)"><input type="number" id="goal-current-reps" placeholder="현재 횟수(회)"></div>
          <div class="input-group"><label>훈련 기간</label><select id="goal-duration" class="custom-select"><option value="1">1개월</option><option value="3" selected>3개월</option><option value="6">6개월</option></select></div>
          <div style="display:flex; gap:10px;">
            <button class="secondary-btn mt-20" onclick="toggleGoalSetup()" style="flex:1;">취소</button>
            <button class="primary-btn mt-20" id="btn-generate-routine" onclick="generateAIRoutines()" style="flex:2;">✨ 루틴 생성하기</button>
          </div>
        </div>
        
        <div id="ai-loading" style="display: none; text-align: center; padding: 30px;"><div class="loader"></div><p class="mt-10" id="ai-loading-text">데이터 분석 및 훈련 스케줄 생성 중...</p></div>
        <div id="ai-routines-area" style="display: none;"><div id="ai-routines-list" class="list-container mt-20"></div><button class="primary-btn mt-20" onclick="startSelectedRoutine()" style="background:#4CAF50;">🚀 선택한 루틴 저장 및 시작</button></div>
      </div>

      <div id="active-goals-list" class="list-container"></div>
    </div>

    <!-- 8. 설정 -->
    <div id="settings-view" class="view-section">
      <h2>⚙️ API 설정</h2>
      <div class="record-card mt-20">
        <label>OpenAI API Key</label>
        <input type="password" id="openai-key" placeholder="sk-...">
        <button class="primary-btn mt-10" onclick="saveApiKey()">키 저장</button>
      </div>
    </div>
  </div>

  <div id="toast-msg" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
